version: "3.8"

services:
  app:
    image: ${APP_IMAGE:-nginx:alpine}
    container_name: ${APP_NAME:-xdocker-app}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./data:/usr/share/nginx/html:ro
    restart: unless-stopped
    environment:
      - ENV=${ENV:-development}

